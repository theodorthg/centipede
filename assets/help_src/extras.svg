<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a140a"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39ff14"/>
    </marker>
    <g id="mush">
      <rect x="-4" y="10" width="8" height="22" fill="#f2fff2"/>
      <circle cx="0" cy="0" r="26" fill="#39ff14"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#f2fff2" stroke-width="2"/>
    </g>
    <g id="mushhurt">
      <rect x="-4" y="10" width="8" height="22" fill="#f2fff2"/>
      <circle cx="0" cy="0" r="26" fill="#27650f"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#f2fff2" stroke-width="2"/>
      <circle cx="-16" cy="-8" r="9" fill="#000"/><circle cx="12" cy="-16" r="8" fill="#000"/><circle cx="14" cy="10" r="9" fill="#000"/>
    </g>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#39ff14" stroke-opacity="0.25" stroke-width="2"/>

  <text x="450" y="76" text-anchor="middle" font-size="46" font-weight="700" fill="#39ff14" letter-spacing="4">WAVES &amp; EXTRAS</text>
  <rect x="330" y="94" width="240" height="4" rx="2" fill="#39ff14"/>

  <!-- 1: the field stays -->
  <text x="60" y="160" font-size="32" font-weight="700" fill="#f2fff2">Your field stays</text>
  <g transform="translate(150 250)"><use xlink:href="#mushhurt"/></g>
  <path d="M215 250 L335 250" stroke="#39ff14" stroke-width="5" fill="none" marker-end="url(#arr)"/>
  <g transform="translate(400 250)"><use xlink:href="#mush"/></g>
  <text x="470" y="236" font-size="30" font-weight="700" fill="#39ff14">+5 pts</text>
  <text x="470" y="272" font-size="22" fill="#8fcf8f">for every mushroom that regrows</text>
  <text x="60" y="340" font-size="23" fill="#8fcf8f">Mushrooms are not swept away between waves.</text>
  <text x="60" y="374" font-size="23" fill="#8fcf8f">After each wave the damaged ones regrow — a few new ones</text>
  <text x="60" y="408" font-size="23" fill="#8fcf8f">are added. Clean shooting leaves a field worth more points.</text>

  <rect x="60" y="440" width="780" height="2" fill="#39ff14" fill-opacity="0.25"/>

  <!-- 2: more heads -->
  <text x="60" y="496" font-size="32" font-weight="700" fill="#f2fff2">More heads every wave</text>
  <text x="60" y="540" font-size="22" fill="#8fcf8f">wave 1</text>
  <g fill="#f2fff2" stroke="#39ff14" stroke-width="2">
    <circle cx="260" cy="534" r="12"/><circle cx="286" cy="534" r="12"/><circle cx="312" cy="534" r="12"/>
    <circle cx="338" cy="534" r="12"/><circle cx="364" cy="534" r="12"/><circle cx="390" cy="534" r="12"/>
    <circle cx="416" cy="534" r="12"/><circle cx="442" cy="534" r="12"/><circle cx="468" cy="534" r="12"/>
    <circle cx="494" cy="534" r="12"/><circle cx="520" cy="534" r="12"/>
  </g>
  <circle cx="234" cy="534" r="12" fill="#39ff14" stroke="#f2fff2" stroke-width="2"/>
  <text x="60" y="598" font-size="22" fill="#8fcf8f">wave 3</text>
  <g fill="#f2fff2" stroke="#39ff14" stroke-width="2">
    <circle cx="286" cy="592" r="12"/><circle cx="312" cy="592" r="12"/>
    <circle cx="338" cy="592" r="12"/><circle cx="364" cy="592" r="12"/><circle cx="390" cy="592" r="12"/>
    <circle cx="416" cy="592" r="12"/><circle cx="442" cy="592" r="12"/><circle cx="468" cy="592" r="12"/>
    <circle cx="494" cy="592" r="12"/>
  </g>
  <circle cx="260" cy="592" r="12" fill="#39ff14" stroke="#f2fff2" stroke-width="2"/>
  <circle cx="560" cy="592" r="12" fill="#39ff14" stroke="#f2fff2" stroke-width="2"/>
  <circle cx="602" cy="592" r="12" fill="#39ff14" stroke="#f2fff2" stroke-width="2"/>
  <text x="640" y="598" font-size="20" fill="#8fcf8f">+ 2 single heads</text>
  <text x="60" y="654" font-size="23" fill="#8fcf8f">Each wave the train is one segment shorter — and one more</text>
  <text x="60" y="688" font-size="23" fill="#8fcf8f">lone head follows it in from the left. Same number of</text>
  <text x="60" y="722" font-size="23" fill="#8fcf8f">segments, but more heads to chase (100 pts each).</text>

  <rect x="60" y="752" width="780" height="2" fill="#39ff14" fill-opacity="0.25"/>

  <!-- 3: DDT -->
  <text x="60" y="808" font-size="32" font-weight="700" fill="#f2fff2">DDT bomb</text>
  <g transform="translate(150 880)">
    <circle cx="0" cy="0" r="58" fill="#ffc933" fill-opacity="0.18"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#ffe27a" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="-22" y="-24" width="44" height="48" fill="#ffc933" stroke="#f2fff2" stroke-width="3"/>
    <line x1="-22" y1="-10" x2="22" y2="-10" stroke="#000" stroke-opacity="0.55" stroke-width="3"/>
    <line x1="-22" y1="14" x2="22" y2="14" stroke="#000" stroke-opacity="0.55" stroke-width="3"/>
    <text x="0" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#000">DDT</text>
  </g>
  <text x="250" y="850" font-size="23" fill="#8fcf8f">One shot sets it off: everything in the blast</text>
  <text x="250" y="884" font-size="23" fill="#8fcf8f">ring goes — centipede, spider, flea, scorpion,</text>
  <text x="250" y="918" font-size="23" fill="#8fcf8f">mushrooms (even other bombs). Usual points,</text>
  <text x="250" y="952" font-size="23" fill="#f2fff2">and it never hurts you.</text>
</svg>
