<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a140a"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <g id="dev">
      <rect x="-34" y="-44" width="68" height="88" rx="10" fill="#000" stroke="#39ff14" stroke-width="3"/>
      <circle cx="-9" cy="-18" r="7" fill="#39ff14"/><circle cx="12" cy="4" r="7" fill="#39ff14"/>
      <circle cx="-14" cy="-32" r="4" fill="#f2fff2"/><circle cx="-4" cy="-32" r="4" fill="#f2fff2"/><circle cx="6" cy="-32" r="4" fill="#f2fff2"/>
      <path d="M0 36 L5 24 L0 27 L-5 24 z" fill="#f2fff2"/>
    </g>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#39ff14" stroke-opacity="0.25" stroke-width="2"/>

  <text x="450" y="76" text-anchor="middle" font-size="46" font-weight="700" fill="#39ff14" letter-spacing="4">LAN &amp; ONLINE</text>
  <rect x="330" y="94" width="240" height="4" rx="2" fill="#39ff14"/>

  <!-- LAN -->
  <text x="60" y="160" font-size="32" font-weight="700" fill="#f2fff2">LAN / Wi-Fi</text>
  <text x="840" y="160" text-anchor="end" font-size="22" fill="#8fcf8f">same network, no server</text>
  <g transform="translate(150 260)"><use xlink:href="#dev"/></g>
  <g transform="translate(750 260)"><use xlink:href="#dev"/></g>
  <path d="M215 260 L685 260" stroke="#39ff14" stroke-width="4" stroke-dasharray="10 8" fill="none"/>
  <text x="450" y="244" text-anchor="middle" font-size="24" font-weight="700" fill="#39ff14">Wi-Fi / cable</text>
  <text x="150" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#f2fff2">HOST</text>
  <text x="750" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#f2fff2">GUEST</text>
  <text x="60" y="394" font-size="23" fill="#8fcf8f">Host:  Play &gt; 2 Players - LAN / Wi-Fi &gt; Host a game</text>
  <text x="60" y="428" font-size="23" fill="#8fcf8f">Guest: ... &gt; Join a game, pick the host (or type its address)</text>
  <text x="60" y="462" font-size="23" fill="#8fcf8f">Host PC with a firewall: allow UDP 47110-47111.</text>

  <rect x="60" y="500" width="780" height="2" fill="#39ff14" fill-opacity="0.25"/>

  <!-- Online -->
  <text x="60" y="560" font-size="32" font-weight="700" fill="#f2fff2">Online</text>
  <text x="840" y="560" text-anchor="end" font-size="22" fill="#8fcf8f">from anywhere, also in the browser</text>
  <g transform="translate(150 670)"><use xlink:href="#dev"/></g>
  <g transform="translate(750 670)"><use xlink:href="#dev"/></g>
  <path d="M190 670 L400 668" stroke="#39ff14" stroke-width="4" fill="none"/>
  <path d="M500 668 L710 670" stroke="#39ff14" stroke-width="4" fill="none"/>
  <!-- cloud: outlined shapes first, the same shapes filled on top hide the inner strokes -->
  <g transform="translate(450 662)">
    <g stroke="#39ff14" stroke-width="7" fill="#000">
      <circle cx="-48" cy="6" r="26"/><circle cx="-18" cy="-18" r="34"/>
      <circle cx="26" cy="-12" r="30"/><circle cx="52" cy="8" r="24"/>
      <rect x="-48" y="-8" width="100" height="40" rx="2"/>
    </g>
    <g fill="#000">
      <circle cx="-48" cy="6" r="26"/><circle cx="-18" cy="-18" r="34"/>
      <circle cx="26" cy="-12" r="30"/><circle cx="52" cy="8" r="24"/>
      <rect x="-48" y="-8" width="100" height="40" rx="2"/>
    </g>
  </g>
  <text x="450" y="666" text-anchor="middle" font-size="26" font-weight="700" fill="#39ff14">K7QM</text>
  <text x="450" y="716" text-anchor="middle" font-size="18" fill="#8fcf8f">room code</text>
  <text x="150" y="748" text-anchor="middle" font-size="22" font-weight="700" fill="#f2fff2">HOST</text>
  <text x="750" y="748" text-anchor="middle" font-size="22" font-weight="700" fill="#f2fff2">GUEST</text>
  <text x="60" y="804" font-size="23" fill="#8fcf8f">Host:  Play &gt; 2 Players - Online &gt; Host a game</text>
  <text x="60" y="838" font-size="23" fill="#8fcf8f">        tell the 4-letter room code to the other player</text>
  <text x="60" y="872" font-size="23" fill="#8fcf8f">Guest: ... &gt; Join a game, type the code</text>

  <text x="450" y="936" text-anchor="middle" font-size="22" fill="#f2fff2">Same game version on both. Connecting takes up to 15 s.</text>
</svg>
