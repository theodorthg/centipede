<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a140a"/><stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173317"/><stop offset="1" stop-color="#0a1a0a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#39ff14" stroke-opacity="0.25" stroke-width="2"/>

  <text x="450" y="76" text-anchor="middle" font-size="52" font-weight="700" fill="#39ff14" letter-spacing="6">KEYBOARD</text>
  <rect x="366" y="94" width="168" height="4" rx="2" fill="#39ff14"/>

  <!-- MOVE: arrow-key cluster, up over left/down/right -->
  <g transform="translate(60 130)">
    <g fill="url(#key)" stroke="#39ff14" stroke-opacity="0.55" stroke-width="2">
      <rect x="64" y="0" width="64" height="64" rx="10"/>
      <rect x="0" y="74" width="64" height="64" rx="10"/>
      <rect x="64" y="74" width="64" height="64" rx="10"/>
      <rect x="128" y="74" width="64" height="64" rx="10"/>
    </g>
    <g fill="#f2fff2" font-size="30" text-anchor="middle">
      <text x="96" y="43">&#8593;</text>
      <text x="32" y="117">&#8592;</text>
      <text x="96" y="117">&#8595;</text>
      <text x="160" y="117">&#8594;</text>
    </g>
    <text x="220" y="105" font-size="30" fill="#8fcf8f">or WASD</text>
    <text x="0" y="182" font-size="34" font-weight="700" fill="#f2fff2">Move</text>
    <text x="0" y="216" font-size="26" fill="#8fcf8f">only within your zone near the bottom</text>
    <text x="0" y="246" font-size="26" fill="#8fcf8f">(size set in Settings)</text>
  </g>

  <!-- SHOOT -->
  <g transform="translate(60 424)">
    <rect x="0" y="0" width="176" height="64" rx="10" fill="url(#key)" stroke="#39ff14" stroke-opacity="0.55" stroke-width="2"/>
    <text x="88" y="41" text-anchor="middle" font-size="23" fill="#f2fff2">Space</text>
    <text x="0" y="112" font-size="34" font-weight="700" fill="#f2fff2">Shoot</text>
    <text x="0" y="146" font-size="26" fill="#8fcf8f">hold = autofire</text>
  </g>

  <rect x="40" y="596" width="820" height="2" fill="#39ff14" fill-opacity="0.25"/>

  <!-- GAMEPAD -->
  <text x="450" y="638" text-anchor="middle" font-size="26" font-weight="700" fill="#f2fff2">Gamepad</text>

  <!-- D-pad: one solid cross -->
  <g transform="translate(230 652)">
    <path d="M36 0 H72 V36 H108 V72 H72 V108 H36 V72 H0 V36 H36 Z"
          fill="url(#key)" stroke="#39ff14" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#f2fff2" font-size="24" font-weight="700" text-anchor="middle">
      <text x="54" y="28">^</text>
      <text x="54" y="98">v</text>
      <text x="18" y="61">&lt;</text>
      <text x="90" y="61">&gt;</text>
    </g>
  </g>

  <g transform="translate(380 667)">
    <circle cx="20" cy="20" r="18" fill="url(#key)" stroke="#39ff14" stroke-opacity="0.55" stroke-width="2"/>
    <text x="20" y="27" text-anchor="middle" font-size="20" fill="#f2fff2" font-weight="700">A</text>
  </g>
  <g transform="translate(380 715)">
    <circle cx="20" cy="20" r="18" fill="url(#key)" stroke="#39ff14" stroke-opacity="0.55" stroke-width="2"/>
    <text x="20" y="27" text-anchor="middle" font-size="20" fill="#f2fff2" font-weight="700">B</text>
  </g>

  <g fill="#8fcf8f" font-size="24">
    <text x="460" y="674">D-pad to move</text>
    <text x="460" y="708">A to shoot / confirm menus</text>
    <text x="460" y="742">B to cancel / go back</text>
  </g>

  <rect x="40" y="800" width="820" height="2" fill="#39ff14" fill-opacity="0.25"/>

  <!-- PAUSE -->
  <g transform="translate(60 828)">
    <rect x="0" y="0" width="86" height="64" rx="10" fill="url(#key)" stroke="#39ff14" stroke-opacity="0.55" stroke-width="2"/>
    <text x="43" y="41" text-anchor="middle" font-size="23" fill="#f2fff2">Esc</text>
    <text x="96" y="40" font-size="26" fill="#8fcf8f">or</text>
    <rect x="140" y="0" width="64" height="64" rx="10" fill="url(#key)" stroke="#39ff14" stroke-opacity="0.55" stroke-width="2"/>
    <text x="172" y="43" text-anchor="middle" font-size="27" fill="#f2fff2">P</text>
    <text x="0" y="112" font-size="30" font-weight="700" fill="#f2fff2">Pause</text>

    <!-- MUTE — same hand-drawn shape as mute_icon.gd -->
    <g transform="translate(480 0)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#39ff14" stroke-opacity="0.6" stroke-width="2"/>
      <polygon points="22.9,27.45 28.75,27.45 36.55,19 36.55,45 28.75,36.55 22.9,36.55" fill="#f2fff2"/>
      <path d="M43.81 22.01 A12.35 12.35 0 0 1 43.81 41.99" fill="none" stroke="#f2fff2" stroke-width="2" stroke-linecap="round"/>
      <path d="M46.87 17.80 A17.55 17.55 0 0 1 46.87 46.20" fill="none" stroke="#f2fff2" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="554" y="40" font-size="26" fill="#8fcf8f">or</text>
    <rect x="590" y="0" width="64" height="64" rx="10" fill="url(#key)" stroke="#39ff14" stroke-opacity="0.55" stroke-width="2"/>
    <text x="622" y="43" text-anchor="middle" font-size="27" fill="#f2fff2">M</text>
    <text x="664" y="40" font-size="26" fill="#8fcf8f">or</text>
    <rect x="700" y="0" width="100" height="64" rx="10" fill="url(#key)" stroke="#39ff14" stroke-opacity="0.55" stroke-width="2"/>
    <text x="750" y="38" text-anchor="middle" font-size="18" fill="#f2fff2">Select</text>
    <text x="480" y="112" font-size="30" font-weight="700" fill="#f2fff2">Mute</text>
  </g>

  <!-- player ship silhouette -->
  <g transform="translate(450 930)">
    <polygon points="0,-26 22,20 0,9 -22,20" fill="#f2fff2" stroke="#39ff14" stroke-width="2"/>
  </g>
</svg>
